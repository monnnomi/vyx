server {
 listen 80;
 server_name joinvyx.com;
 root /opt/vyx/current/public;
 index index.html;
 client_max_body_size 3m;
 access_log /var/log/nginx/vyx-access.log vyx;
 error_log /var/log/nginx/vyx-error.log warn;
 gzip on;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json image/svg+xml;
 location = /admin { proxy_pass http://127.0.0.1:4173; }
 location / { proxy_pass http://127.0.0.1:4173; }
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_http_version 1.1;
 proxy_read_timeout 75s;
 location ~ /\. { deny all; }
}
